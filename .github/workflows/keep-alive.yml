name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This pings the
# database once a day using the public URL/key already in frontend/js/config.js.
#
# GitHub also switches off scheduled workflows after 60 days without commits.
# The last step re-enables this workflow on every run, which restarts that
# 60-day count, so the ping keeps running even when nobody commits.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # only for re-enabling this workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" frontend/js/config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" frontend/js/config.js)
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
