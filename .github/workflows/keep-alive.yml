name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This pings the
# database once a day using the public URL/key already in frontend/js/config.js.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" frontend/js/config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" frontend/js/config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
