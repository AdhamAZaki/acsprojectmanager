name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A new cache name per deploy, so installed apps pick up the new version.
      - name: Stamp app version
        run: |
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'acs-tracker-${GITHUB_SHA::12}'/" frontend/sw.js
          grep -q "acs-tracker-${GITHUB_SHA::12}" frontend/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
