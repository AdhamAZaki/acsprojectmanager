<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Private tasks</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../icons/acs-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .pv-wrap { max-width: 980px; margin: 0 auto; }
    .pv-lock { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-2); background: var(--brand-soft); border-radius: 999px; padding: 2px 10px; }
    .pv-add { display: grid; gap: 8px; }
    .pv-add-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pv-add-row input[name=project] { flex: 1 1 200px; width: auto; }
    .pv-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
    .pv-row:first-of-type { border-top: 0; }
    .pv-row .pv-title { flex: 1; min-width: 0; }
    .pv-row.done .pv-title { color: var(--muted); text-decoration: line-through; }
    .pv-row small { color: var(--muted); }
    .pv-check { width: 24px; height: 24px; min-height: 24px; padding: 0; border-radius: 7px; border: 2px solid var(--muted); background: var(--surface); color: #fff; display: grid; place-items: center; flex: none; }
    .pv-check.on { background: var(--ok); border-color: var(--ok); }
    .pv-tag { font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .pv-tag.acs { background: #E6F0FE; color: #1F5FBF; }
    .pv-tag.sent { background: var(--ok-soft); color: var(--ok); }
    .pv-link { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pv-link input { width: auto; flex: 1 1 160px; }
    .pv-icon { background: none; border: 0; min-height: 32px; padding: 4px 8px; color: var(--muted); }
    body:not(.signed-in) .topbar { display: flex; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo-mark" src="../icons/acs-mark.svg" alt="" width="30" height="30"><span class="brand-name">Private tasks<small>Only you can see these</small></span></div>
    <span class="sync" id="sync" title="Sync status"></span>
    <button class="ghost small-btn" id="outBtn" type="button" hidden>Sign out</button>
  </header>
  <main class="pv-wrap" id="view"><div class="skeleton"></div></main>
  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script defer src="../js/config.js"></script>
  <script defer src="config.js"></script>
  <script defer src="private.js"></script>
</body>
</html>
