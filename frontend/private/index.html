<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Private tasks</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../icons/acs-mark.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Private">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="wt">
  <main id="app"><div id="loginView"><div class="skeleton"></div></div></main>

  <!-- The same page as the ACS app: the top part stays put; only the tasks (#view) scroll. A task opens in #panel. -->
  <div class="w-frame" id="shell" hidden>
    <div class="w-shell">
      <header class="w-top">
        <img class="logo-mark" src="../icons/acs-mark.svg" alt="" width="28" height="28">
        <span class="w-brand">Private tasks<small>Only you can see these</small></span>
        <div class="w-gsearch" id="gsearch"></div>
        <div class="w-actions">
          <span class="sync" id="sync" title="Sync status"></span>
          <span class="w-actions-in" id="topActions"></span>
        </div>
      </header>
      <div id="bars"></div>
      <section class="w-data" id="view"></section>
    </div>
    <aside class="w-panel" id="panel" aria-label="Task" hidden></aside>
  </div>

  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script defer src="../js/config.js"></script>
  <script defer src="config.js"></script>
  <script defer src="private.js"></script>
</body>
</html>
