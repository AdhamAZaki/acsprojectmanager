<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ACS Weekly Tasks</title>
  <meta name="description" content="Weekly tasks, shared projects and minutes of meeting for the ACS engineering teams.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ACS Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/acs-mark.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://bhjqtygkegqhggpdtrlm.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking the first paint; system font shows until it arrives. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="wt">
  <main id="app">
    <section class="login" id="loginView" hidden>
      <div class="login-card">
        <div class="login-logo"><img src="icons/acs-mark.svg" alt="" width="64" height="64"><span>ADVANCED<br>CONTROL<small>SYSTEMS</small></span></div>
        <h1>Weekly Tasks</h1>
        <p>Your tasks for this week and next — the weekly meeting writes itself.</p>
        <form id="loginForm" class="login-form">
          <label class="field">Username<input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
          <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
          <p class="error" id="loginError" hidden></p>
          <button class="primary big" type="submit">Sign in</button>
        </form>
        <p class="hint">Forgot your password? Ask an admin to reset it.</p>
      </div>
    </section>
  </main>

  <!-- The one page. The top part stays put; only the tasks (#view) scroll. A task or project opens in #panel. -->
  <div class="w-frame" id="shell" hidden>
    <div class="w-shell">
      <header class="w-top">
        <img class="logo-mark" src="icons/acs-mark.svg" alt="ACS" width="28" height="28">
        <span class="w-brand">Weekly Tasks<small>Advanced Control Systems</small></span>
        <div class="w-gsearch" id="gsearch"></div>
        <div class="w-actions">
          <span class="sync" id="sync" title="Sync status"></span>
          <span class="w-actions-in" id="topActions"></span>
          <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Account"></button>
        </div>
      </header>
      <div id="bars"></div>
      <section class="w-data" id="view"></section>
    </div>
    <aside class="w-panel" id="panel" aria-label="Task or project" hidden></aside>
  </div>

  <dialog id="manageDlg" class="w-manage"></dialog>
  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
