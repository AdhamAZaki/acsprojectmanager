<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ACS Weekly Tasks</title>
  <meta name="description" content="Weekly project updates and minutes of meeting for the ACS PLC / AVEVA team.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ACS Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/acs-mark.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://bhjqtygkegqhggpdtrlm.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking the first paint; system font shows until it arrives. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo-mark" src="icons/acs-mark.svg" alt="ACS" width="30" height="30"><span class="brand-name">Weekly Tasks<small>Advanced Control Systems</small></span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <span class="sync" id="sync" title="Sync status"></span>
    <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Account"></button>
  </header>

  <main id="app">
    <section class="login" id="loginView" hidden>
      <div class="login-card">
        <div class="login-logo"><img src="icons/acs-mark.svg" alt="" width="64" height="64"><span>ADVANCED<br>CONTROL<small>SYSTEMS</small></span></div>
        <h1>Weekly Tasks</h1>
        <p>Your tasks for this week and next — the weekly meeting writes itself.</p>
        <form id="loginForm" class="login-form">
          <label class="field">Username<input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
          <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
          <p class="error" id="loginError" hidden></p>
          <button class="primary big" type="submit">Sign in</button>
        </form>
        <p class="hint">Forgot your password? Ask an admin to reset it.</p>
      </div>
    </section>
    <section id="view"></section>
  </main>

  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
